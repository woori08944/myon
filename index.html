<head>
<meta charset="utf-8">

<title>마이온 · MY ONE</title>
<style>
:root { color-scheme: light; font: 16px/1.6 system-ui, -apple-system, "Malgun Gothic", sans-serif; }
* { box-sizing: border-box; }
body { margin: 0; }
[hidden] { display: none !important; }

.myone-entrance {
  --entry-ink: #14392e;
  --entry-action: #245744;
  display: grid;
  place-items: center;
  min-height: 100vh;
  min-height: 100dvh;
  padding: max(18px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right))
    max(18px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
  color: var(--entry-ink);
  background: #f3f1eb;
}
.myone-entrance-card {
  display: grid;
  width: min(100%, 29rem);
  overflow: hidden;
  border: 1px solid #deddd3;
  border-radius: 20px;
  background: #fffefa;
  box-shadow: 0 12px 32px #182b2010;
}
.myone-entrance-photo {
  display: block;
  width: 100%;
  height: clamp(11rem, 35vh, 16.5rem);
  height: clamp(11rem, 35dvh, 16.5rem);
  object-fit: cover;
  object-position: 72% center;
  color: transparent;
  background: #eae2d2;
}
.myone-entrance-panel {
  min-width: 0;
  padding: 25px clamp(22px, 6.5vw, 34px) 28px;
  border-top: 1px solid #e3e3d5;
}
.myone-entrance h1 {
  margin: 0 0 20px;
  color: inherit;
  font-size: clamp(2.25rem, 9vw, 3rem);
  line-height: 1;
  font-weight: 730;
  letter-spacing: -.06em;
}
.myone-google-button {
  display: flex;
  align-items: center;
  justify-content: center;
  width: fit-content;
  max-width: 100%;
  min-width: min(11rem, 100%);
  min-height: 46px;
  padding: 10px 20px;
  border: 1px solid #788e80;
  border-radius: 10px;
  background: #edf3ee;
  color: var(--entry-action);
  font: inherit;
  font-weight: 650;
  line-height: 1.35;
}
@media (hover: hover) {
  .myone-google-button:not(:disabled):hover { background: #e0ece3; }
}
.myone-entrance :is(button, a):focus-visible { outline: 2px solid #2d6a56; outline-offset: 3px; }
@media (min-width: 600px) and (max-width: 899px) {
  .myone-entrance-card { width: min(100%, 34rem); }
  .myone-entrance-photo { height: clamp(13rem, 43vw, 19rem); }
  .myone-entrance-panel { padding: 30px 38px 34px; }
}
@media (min-width: 900px) {
  .myone-entrance {
    padding: 36px clamp(30px, 5vw, 80px);
  }
  .myone-entrance-card {
    grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr);
    width: min(100%, 57rem);
    min-height: clamp(22rem, 55vh, 29rem);
  }
  .myone-entrance-visual {
    position: relative;
    background: #eae2d2;
  }
  .myone-entrance-photo {
    position: absolute;
    inset: 0;
    height: 100%;
    object-position: 72% center;
  }
  .myone-entrance-panel {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: flex-start;
    padding: 36px clamp(32px, 4vw, 56px);
    border-top: 0;
    border-left: 1px solid #e3e3d5;
  }
  .myone-entrance h1 {
    font-size: clamp(2.75rem, 4vw, 3.5rem);
  }
}
@media (max-width: 899px) and (max-height: 670px) {
  .myone-entrance-photo { height: clamp(8rem, 33vh, 13rem); }
  .myone-entrance-panel { padding-block: 20px 23px; }
}

.myone-google-button { cursor: pointer; }
.myone-google-button:disabled { opacity: .65; cursor: wait; }
#status, noscript { margin: 12px 0 0; font-size: .875rem; color: #485b51; word-break: keep-all; overflow-wrap: anywhere; }
#signout { margin-top: 12px; }
.myone-entrance-panel a { color: #14392e; text-underline-offset: .2em; }

    if (!r.ok) { const error = new Error('Request failed'); error.status = r.status; throw error; }
    return r.status === 204 ? null : r.json();
  }
  function sessionOf(grant) {
    if (!grant?.access_token || !grant?.refresh_token) throw new Error('Invalid session');
    return {access_token:grant.access_token,refresh_token:grant.refresh_token,expires_at:grant.expires_at || Math.floor(Date.now()/1000)+(grant.expires_in || 3600)};
  }
  async function revoke(token) {
    if (token) await request('/auth/v1/logout?scope=local','POST',undefined,token).catch(() => {});
  }
  if (location.origin !== new URL(callback).origin) {
    status.textContent = '마이온 운영 주소에서 열어 주세요.';
    const link = document.createElement('a');
    link.href = callback;
    link.textContent = '마이온 열기';
    document.querySelector('main').append(link);
    return;
  }
  signIn.onclick = async () => {
    signIn.disabled = true;
    try {
      const settings = await request('/auth/v1/settings','GET');
      if (settings?.external?.google !== true) {
        showSignIn('마이온의 Google 로그인 연결을 준비하고 있어요.'); return;
      }
      const verifier = encode(crypto.getRandomValues(new Uint8Array(48)));
      const digest = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
      sessionStorage.setItem(flowKey,JSON.stringify({verifier,created:Date.now(),route:location.hash}));
      const url = new URL(base+'/auth/v1/authorize');
      url.search = new URLSearchParams({provider:'google',redirect_to:callback,code_challenge:encode(new Uint8Array(digest)),code_challenge_method:'s256',scopes:workspaceScopes,prompt:'select_account'});
      location.assign(url.href);
    } catch { showSignIn('로그인을 시작하지 못했어요. 연결을 확인한 뒤 다시 시도해 주세요.'); }
  };
  let signedOut = false;
  signOut.onclick = async () => {
    signedOut = true;
    signOut.disabled = true;
    let token;
    try { token = JSON.parse(sessionStorage.getItem(sessionKey))?.access_token; } catch {}
    clear();
    await revoke(token);
    signOut.disabled = false;
    showSignIn('로그아웃했어요.');
  };
  let session, providerToken;
  try {
    const url = new URL(location.href);
    const driveFlow = JSON.parse(sessionStorage.getItem('myon125.oauth-flow') || 'null');
    const fromDrive = Boolean(driveFlow?.drive && driveFlow?.owner && (url.searchParams.has('code') || url.searchParams.has('error') || new URLSearchParams(url.hash.slice(1)).has('error')));
    const code = fromDrive ? null : url.searchParams.get('code');
    let route = /^#[a-z0-9]/i.test(url.hash) ? url.hash : '#today';
    if (!fromDrive && (url.search || url.hash)) history.replaceState(null,'',location.pathname + route);
    if (!fromDrive && (url.searchParams.has('error') || new URLSearchParams(url.hash.slice(1)).has('error'))) {
      sessionStorage.removeItem(flowKey); showSignIn('Google 로그인이 완료되지 않았어요. 다시 시도할 수 있어요.'); return;
    }
    if (code) {
      const flow = JSON.parse(sessionStorage.getItem(flowKey) || 'null');
      sessionStorage.removeItem(flowKey);
      if (!flow || !Number.isFinite(flow.created) || Date.now()-flow.created>15*60*1000 || !flow.verifier) {
        showSignIn('로그인을 시작했던 창에서 다시 시도해 주세요.'); return;
      }
      if(/^#[a-z0-9]/i.test(flow.route||'')) route=flow.route;
      const grant = await request('/auth/v1/token?grant_type=pkce','POST',{auth_code:code,code_verifier:flow.verifier});
      session = sessionOf(grant);
      providerToken = grant.provider_token || '';
      sessionStorage.removeItem('myon125.drive-token');
    } else {
      session = JSON.parse(sessionStorage.getItem(sessionKey) || 'null');
      if (!session) { showSignIn('사용할 Google 계정을 선택하세요.'); return; }
      if (session.expires_at < Date.now()/1000+60) {
        session = sessionOf(await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token}));
      }
    }
    if ((await request('/rest/v1/rpc/myon_claim_owner_147','POST',{},session.access_token)) !== true) {
      clear(); await revoke(session.access_token); showSignIn('등록된 마이온 계정으로 다시 로그인해 주세요.'); return;
    }
    sessionStorage.setItem(sessionKey,JSON.stringify(sessionOf(session)));
    signIn.hidden = true;
    signOut.hidden = false;
    status.textContent = '나의 오늘을 여는 중이에요.';
    const user = await request('/auth/v1/user','GET',undefined,session.access_token);
    if (signedOut) return;
    if(!user?.id) throw Error('계정 확인이 필요해요.');
    if (providerToken) {
      sessionStorage.setItem('myon125.drive-token',JSON.stringify({owner:user.id,token:providerToken,expiresAt:Date.now()+55*60*1000}));
      sessionStorage.setItem('myon125.drive-used','yes');
    }
    if (signedOut) return;
    const parts = [];
    for(let start=0;start<release.parts;start+=5) {
      const rows = await request('/rest/v1/myon_release_parts?select=part,body&release_id=eq.'+release.digest+'&order=part.asc&limit=5&offset='+start,'GET',undefined,session.access_token);
      if (signedOut) return;
      if(!Array.isArray(rows) || rows.length!==Math.min(5,release.parts-start)) throw Error('배포 파일을 읽을 수 없어요.');
      for(const row of rows) {
        if(row.part!==parts.length || typeof row.body!=='string')throw Error('배포 파일을 읽을 수 없어요.');
        parts.push(row.body);
      }
    }
    const binary = atob(parts.join(''));
    if(binary.length!==release.compressed)throw Error('배포 파일의 크기를 확인해 주세요.');
    const packed=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const bytes=await new Response(stream).arrayBuffer();
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');
    if (signedOut) return;
    if(digest!==release.digest || bytes.byteLength!==release.size)throw Error('배포 파일을 확인하지 못했어요.');
    if(!fromDrive) history.replaceState(null,'',location.pathname+route);
    window.myonVerifiedOwner=user.id;
    const trustedHtml = new TextDecoder('utf-8',{fatal:true}).decode(bytes);
    document.open();
    document.write(trustedHtml);
    document.close();
  } catch (error) {
    if (signedOut) return;
    if ([400,401,403].includes(error.status)) clear();
    if (session && ![400,401,403].includes(error.status)) {
      status.textContent='마이온 화면을 불러오지 못했어요. 네트워크를 확인하고 다시 열어 주세요.';
      signIn.textContent='다시 열기';signIn.hidden=false;signIn.disabled=false;signIn.onclick=()=>location.reload();
      signOut.hidden=false;
    } else showSignIn('마이온이 계정을 확인하지 못했어요. 다시 시도해 주세요.');
  }
})();
</script></body></html>
