<script>
(async () => {
  const base = 'https://rwzktbohidfjhmykqjjq.supabase.co';
  const callback = 'https://myon.wdwave.kr/';
  const release = {"digest":"7b0366bd07328c46212a70601950e53aa3423bcefdd0b225d762c37da1989d6f","gzip":"f5fd3907bdfb6a335441c7c034ac5c22af335cb548d06125ca03a2bb40d1c2f1","size":9017772,"compressed":4067659,"parts":46};
  const apiKey = 'sb_publishable_ahMFRBwmwVpKV6QqivsU7A_tu-Kw9bC';
  const workspaceScopes = ['drive.file','calendar.events.readonly','tasks.readonly']
    .map(name => 'https://www.googleapis.com/auth/' + name).join(' ');
  const flowKey = 'myon147.home-flow';
  const sessionKey = 'myon125.session';
  const status = document.getElementById('status');
  const signIn = document.getElementById('signin');
  const signOut = document.getElementById('signout');
  const encode = bytes => btoa(String.fromCharCode(...bytes)).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
  const clear = () => {
    for (const key of [sessionKey, flowKey, 'myon125.drive-token', 'myon125.oauth-flow']) sessionStorage.removeItem(key);
  };
  const showSignIn = message => {
    status.textContent = message;
    signIn.hidden = false;
    signIn.disabled = false;
    signOut.hidden = true;
  };
  async function request(path, method, body, token) {
    const headers = {apikey:apiKey};
    if (token) headers.Authorization = 'Bearer ' + token;
    if (body !== undefined) headers['Content-Type'] = 'application/json';
    const r = await fetch(base + path, {method,headers,body:body === undefined ? undefined : JSON.stringify(body), cache:'no-store', signal:AbortSignal.timeout(15000)});
    if (!r.ok) { const error = new Error('Request failed'); error.status = r.status; throw error; }
    return r.status === 204 ? null : r.json();
  }
  function sessionOf(grant) {
    if (!grant?.access_token || !grant?.refresh_token) throw new Error('Invalid session');
    return {access_token:grant.access_token,refresh_token:grant.refresh_token,expires_at:grant.expires_at || Math.floor(Date.now()/1000)+(grant.expires_in || 3600)};
  }
  async function revoke(token) {
    if (token) await request('/auth/v1/logout?scope=local','POST',undefined,token).catch(() => {});
  }
  if (location.origin !== new URL(callback).origin) {
    status.textContent = '마이온 운영 주소에서 열어 주세요.';
    const link = document.createElement('a');
    link.href = callback;
    link.textContent = '마이온 열기';
    document.querySelector('main').append(link);
    return;
  }
  let chooseAnotherAccount = false;
  async function startGoogleSignIn() {
    status.textContent = 'Google에 연결하고 있어요.';
    signIn.disabled = true;
    try {
      const settings = await request('/auth/v1/settings','GET');
      if (settings?.external?.google !== true) {
        showSignIn('마이온의 Google 로그인 연결을 준비하고 있어요.'); return;
      }
      const verifier = encode(crypto.getRandomValues(new Uint8Array(48)));
      const digest = await crypto.subtle.digest('SHA-256',new TextEncoder().encode(verifier));
      sessionStorage.setItem(flowKey,JSON.stringify({verifier,created:Date.now(),route:location.hash}));
      const url = new URL(base+'/auth/v1/authorize');
      url.search = new URLSearchParams({provider:'google',redirect_to:callback,code_challenge:encode(new Uint8Array(digest)),code_challenge_method:'s256',scopes:workspaceScopes});
      if (chooseAnotherAccount) url.searchParams.set('prompt', 'select_account');
      location.assign(url.href);
    } catch { showSignIn('로그인을 시작하지 못했어요. 연결을 확인한 뒤 다시 시도해 주세요.'); }
  }
  signIn.onclick = startGoogleSignIn;
  window.addEventListener('pageshow', event => {
    if (event.persisted && sessionStorage.getItem(flowKey) && !sessionStorage.getItem(sessionKey)) {
      showSignIn('Google 로그인을 다시 시작할 수 있어요.');
    }
  });
  let signedOut = false;
  signOut.onclick = async () => {
    signedOut = true;
    chooseAnotherAccount = true;
    signOut.disabled = true;
    let token;
    try { token = JSON.parse(sessionStorage.getItem(sessionKey))?.access_token; } catch {}
    clear();
    await revoke(token);
    signOut.disabled = false;
    showSignIn('로그아웃했어요.');
  };
  let session, providerToken, grantUser;
  try {
    const url = new URL(location.href);
    const driveFlow = JSON.parse(sessionStorage.getItem('myon125.oauth-flow') || 'null');
    const fromDrive = Boolean(driveFlow?.drive && driveFlow?.owner && (url.searchParams.has('code') || url.searchParams.has('error') || new URLSearchParams(url.hash.slice(1)).has('error')));
    const code = fromDrive ? null : url.searchParams.get('code');
    let route = /^#[a-z0-9]/i.test(url.hash) ? url.hash : '#today';
    if (!fromDrive && (url.search || url.hash)) history.replaceState(null,'',location.pathname + route);
    if (!fromDrive && (url.searchParams.has('error') || new URLSearchParams(url.hash.slice(1)).has('error'))) {
      sessionStorage.removeItem(flowKey); showSignIn('Google 로그인이 완료되지 않았어요. 다시 시도할 수 있어요.'); return;
    }
    if (code) {
      const flow = JSON.parse(sessionStorage.getItem(flowKey) || 'null');
      sessionStorage.removeItem(flowKey);
      if (!flow || !Number.isFinite(flow.created) || Date.now()-flow.created>15*60*1000 || !flow.verifier) {
        showSignIn('로그인을 시작했던 창에서 다시 시도해 주세요.'); return;
      }
      if(/^#[a-z0-9]/i.test(flow.route||'')) route=flow.route;
      const grant = await request('/auth/v1/token?grant_type=pkce','POST',{auth_code:code,code_verifier:flow.verifier});
      session = sessionOf(grant);
      grantUser = grant.user;
      providerToken = grant.provider_token || '';
      sessionStorage.removeItem('myon125.drive-token');
    } else {
      session = JSON.parse(sessionStorage.getItem(sessionKey) || 'null');
      if (!session) {
        if (fromDrive) sessionStorage.removeItem('myon125.oauth-flow');
        showSignIn('');
        return;
      }
      if (session.expires_at < Date.now()/1000+60) {
        const grant = await request('/auth/v1/token?grant_type=refresh_token','POST',{refresh_token:session.refresh_token});
        session = sessionOf(grant);
        grantUser = grant.user;
      }
    }
    if ((await request('/rest/v1/rpc/myon_claim_owner_147','POST',{},session.access_token)) !== true) {
      chooseAnotherAccount = true;
      clear(); await revoke(session.access_token); showSignIn('등록된 마이온 계정으로 다시 로그인해 주세요.'); return;
    }
    sessionStorage.setItem(sessionKey,JSON.stringify(sessionOf(session)));
    signIn.hidden = true;
    const user = grantUser?.id ? grantUser : await request('/auth/v1/user','GET',undefined,session.access_token);
    if (signedOut) return;
    if(!user?.id) throw Error('계정 확인이 필요해요.');
    if (providerToken) {
      sessionStorage.setItem('myon125.drive-token',JSON.stringify({owner:user.id,token:providerToken,expiresAt:Date.now()+55*60*1000}));
      sessionStorage.setItem('myon125.drive-used','yes');
    }
    if (signedOut) return;
    const parts = [];
    const pageSize = 10;
    const pagesPerBatch = 3;
    for (let batchStart = 0; batchStart < release.parts; batchStart += pageSize * pagesPerBatch) {
      const requests = [];
      const batchEnd = Math.min(batchStart + pageSize * pagesPerBatch, release.parts);
      for (let start = batchStart; start < batchEnd; start += pageSize) {
        const path = '/rest/v1/myon_release_parts?select=part,body&release_id=eq.'
          + release.digest + '&order=part.asc&limit=' + pageSize + '&offset=' + start;
        requests.push(request(path, 'GET', undefined, session.access_token));
      }
      // Promise.all preserves request order even when pages arrive out of order.
      const pages = await Promise.all(requests);
      if (signedOut) return;
      for (const rows of pages) {
        if (!Array.isArray(rows) || rows.length !== Math.min(pageSize, release.parts - parts.length)) {
          throw Error('배포 파일을 읽을 수 없어요.');
        }
        for (const row of rows) {
          if (row.part !== parts.length || typeof row.body !== 'string') {
            throw Error('배포 파일을 읽을 수 없어요.');
          }
          parts.push(row.body);
        }
      }
    }
    const binary = atob(parts.join(''));
    if(binary.length!==release.compressed)throw Error('배포 파일의 크기를 확인해 주세요.');
    const packed=Uint8Array.from(binary,c=>c.charCodeAt(0));
    const stream=new Blob([packed]).stream().pipeThrough(new DecompressionStream('gzip'));
    const bytes=await new Response(stream).arrayBuffer();
    const digest=Array.from(new Uint8Array(await crypto.subtle.digest('SHA-256',bytes)),v=>v.toString(16).padStart(2,'0')).join('');
    if (signedOut) return;
    if(digest!==release.digest || bytes.byteLength!==release.size)throw Error('배포 파일을 확인하지 못했어요.');
    if(!fromDrive) history.replaceState(null,'',location.pathname+route);
    window.myonVerifiedOwner=user.id;
    const trustedHtml = new TextDecoder('utf-8',{fatal:true}).decode(bytes);
    document.open();
    document.write(trustedHtml);
    const entrance = document.getElementById('myone-entrance');
    const card = entrance?.querySelector('.myone-entrance-card');
    if (card && !entrance.hidden) {
      // The authenticated app still mounts its standalone welcome card while initializing.
      card.hidden = true;
      const observer = new MutationObserver(() => {
        if (!entrance.hidden && !entrance.querySelector('#entrance-preview-status')?.textContent) return;
        observer.disconnect();
        card.hidden = false;
      });
      observer.observe(entrance, {attributes:true, attributeFilter:['hidden'], childList:true, characterData:true, subtree:true});
    }
    document.close();
  } catch (error) {
    if (signedOut) return;
    if ([400,401,403].includes(error.status)) clear();
    if (session && ![400,401,403].includes(error.status)) {
      status.textContent='마이온 화면을 불러오지 못했어요. 네트워크를 확인하고 다시 열어 주세요.';
      signIn.textContent='다시 열기';signIn.hidden=false;signIn.disabled=false;signIn.onclick=()=>location.reload();
      signOut.hidden=false;
    } else showSignIn('마이온이 계정을 확인하지 못했어요. 다시 시도해 주세요.');
  }
})();
